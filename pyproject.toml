[project]
name = "review-thermo"
version = "0.1.0"
description = "하루마켓 리뷰 온도계 (수업 실습용)"
authors = [{ name = "김연지" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
    "numpy>=1.26",
    "huggingface_hub>=0.24",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

